<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFF00" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121216" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Shield -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="14" />
  
  <!-- Subtle Internal Grid Lines -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="rgba(255,255,255,0.06)" stroke-width="6" stroke-dasharray="12 12" />
  <line x1="256" y1="80" x2="256" y2="432" stroke="rgba(255,255,255,0.06)" stroke-width="6" stroke-dasharray="12 12" />
  
  <!-- Neon Accent dot -->
  <circle cx="396" cy="116" r="14" fill="#FFFF00" filter="url(#neon)" />
  <circle cx="396" cy="116" r="8" fill="#FFFFFF" />

  <!-- High-Impact Geometric Monogram "A" + Developer Glyphs -->
  <g filter="url(#neon)">
    <!-- Left Leg -->
    <path d="M256 104L136 384H208L240 308H272L304 384H376L256 104Z" fill="url(#glowGrad)" />
    <!-- Knockout Inner Triangle -->
    <polygon points="256,182 236,252 276,252" fill="#050507" />
  </g>

  <!-- Sharp Core Glyph -->
  <path d="M256 104L136 384H208L240 308H272L304 384H376L256 104Z" fill="url(#glowGrad)" />
  <polygon points="256,182 236,252 276,252" fill="#050507" />
  
  <!-- Bottom Terminal Beam -->
  <path d="M190 348H322" stroke="#FFFF00" stroke-width="12" stroke-linecap="round" />
</svg>